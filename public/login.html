<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — RGM Project Manager</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<main class="signin">
  <form class="signin-card" id="form">
    <div class="brand" style="padding:0">
      <div class="mark">R</div>
      <div><b>RGM Project Manager</b><span>Developer ↔ tester</span></div>
    </div>
    <h1 id="heading">Sign in</h1>
    <p class="signin-note" id="note">
      Enter your address and we will send a one-time sign-in link.
    </p>
    <div id="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>
    </div>
    <button class="btn pri" type="submit" id="submit">Send link</button>
    <p class="signin-hint" id="hint"></p>
  </form>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
