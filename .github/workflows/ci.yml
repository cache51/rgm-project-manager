# CI: run the suite on both database drivers, plus a real smoke run.
#
# The driver matrix is the point. `src/db.js` claims PGlite and node-postgres are
# interchangeable; running the same tests through both is what makes that a fact
# rather than an assertion in a comment.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node 20 is the floor declared in package.json engines.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests on the embedded driver
        run: npm test
      - name: Tests through the node-postgres driver
        run: npm run test:pg

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start the server against a file-backed database and drive the CLI
        run: bash scripts/smoke.sh

  # A real Postgres, to check the migrations against the server the product is
  # actually deployed on — PGlite is Postgres, but it is not the whole story
  # (roles, extensions and the client protocol are the server's).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rgm
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply every migration to a real Postgres and verify the grants
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rgm
        run: |
          node -e '
            import("./src/db.js").then(async ({ createDb, migrate, migrationFiles }) => {
              const db = await createDb();
              const { applied } = await migrate(db, { log: console.log });
              const files = migrationFiles();
              if (applied.length !== files.length) {
                throw new Error(`applied ${applied.length} of ${files.length} migrations`);
              }
              const roles = await db.query(
                "SELECT rolname FROM pg_roles WHERE rolname LIKE $$rgm_%$$");
              if (roles.rows.length !== 2) {
                throw new Error("expected rgm_runtime and rgm_auditor, got " + roles.rows.length);
              }
              // The runtime role has to be able to do the application's work —
              // it held only `events` once, which made it unusable as one (IR-004).
              await db.query("SET ROLE rgm_runtime");
              const readable = await db.query("SELECT count(*)::int AS c FROM users");
              if (readable.rows[0].c !== 0) throw new Error("unexpected rows in users");
              await db.query("RESET ROLE");
              const users = await db.query("SELECT to_regclass($$public.users$$) AS t");
              if (!users.rows[0].t) throw new Error("users table missing");
              console.log("migrations, roles and the runtime grants verified against real Postgres");
              await db.close();
            }).catch((e) => { console.error(e); process.exit(1); });
          '
      - name: The app suite runs against real Postgres too
        env:
          # RGM_TEST_PG_URL, not RGM_TEST_DRIVER: the latter uses the in-process
          # double, so this job was named for something it did not do (IR-034).
          # Each test world gets its own database on the server below.
          RGM_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/rgm
        run: node --test --test-concurrency=1 test/*.test.js
