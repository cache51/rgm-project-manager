<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RGM Project Manager — Mock UI</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --side:#0f172a; --side-ink:#cbd5e1; --accent:#4f46e5; --accent-soft:#eef2ff;
    --high:#dc2626; --high-bg:#fef2f2; --med:#d97706; --med-bg:#fffbeb; --low:#0891b2; --low-bg:#ecfeff;
    --ok:#059669; --ok-bg:#ecfdf5; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
      "PingFang SC","Hiragino Sans GB","Noto Sans",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100vh;overflow:hidden}
  .side{width:262px;flex:0 0 262px;background:var(--side);color:var(--side-ink);
        display:flex;flex-direction:column;padding:18px 14px;gap:16px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#a855f7);
       display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto}
  .brand b{color:#fff;font-size:14px;letter-spacing:.2px}
  .brand span{display:block;font-size:11px;color:#7c8798;font-weight:400}
  .side h4{margin:0 6px 7px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
           color:#64748b;font-weight:600}
  .roles{display:flex;flex-direction:column;gap:4px}
  .role{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;
        border:1px solid transparent;color:var(--side-ink);font-size:13px;transition:.15s}
  .role:hover{background:#1e293b}
  .role.on{background:#1e293b;border-color:#334155;color:#fff}
  .role .dot{width:7px;height:7px;border-radius:50%;background:#475569;margin-left:auto;flex:0 0 auto}
  .role.on .dot{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
  .plist{display:flex;flex-direction:column;gap:3px}
  .proj{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;
        font-size:12.5px;color:var(--side-ink);transition:.15s;border:1px solid transparent}
  .proj:hover{background:#1e293b}
  .proj.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .proj .sq{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
  .proj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proj .cnt{margin-left:auto;font-size:10px;font-weight:700;background:#334155;color:#e2e8f0;
        padding:1px 6px;border-radius:20px;flex:0 0 auto}
  .proj.on .cnt{background:rgba(255,255,255,.28);color:#fff}
  .proj .cnt.zero{background:transparent;color:#475569}
  nav{display:flex;flex-direction:column;gap:3px}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
       font-size:13px;color:var(--side-ink);transition:.15s}
  .nav:hover{background:#1e293b}
  .nav.on{background:#1e293b;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  .nav .badge{margin-left:auto;background:#334155;color:#e2e8f0;font-size:10.5px;font-weight:600;
       padding:1px 7px;border-radius:20px}
  .side .spacer{flex:1;min-height:8px}
  .langbox{border-top:1px solid #1e293b;padding-top:12px}
  .langrow{display:flex;gap:5px;padding:0 4px}
  .lang{flex:1;text-align:center;padding:6px 4px;border-radius:7px;font-size:11.5px;cursor:pointer;
        color:#94a3b8;border:1px solid #1e293b;transition:.15s}
  .lang:hover{background:#1e293b}
  .lang.on{background:#eef2ff;color:#3730a3;border-color:#c7d2fe;font-weight:600}
  .synced{font-size:10.5px;color:#64748b;padding:0 6px;margin-top:2px}
  .synced b{color:#94a3b8;font-weight:600}

  main{flex:1;overflow-y:auto}
  .top{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;
       position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px}
  .top .project{font-size:12px;color:var(--muted)}
  .top h2{margin:1px 0 0;font-size:17px;letter-spacing:-.2px}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--accent-soft);
        color:#3730a3;font-weight:600;white-space:nowrap}
  .pill.gray{background:#f1f5f9;color:#475569}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .av{width:28px;height:28px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;
      place-items:center;font-size:11px;font-weight:700}
  .wrap{padding:22px 26px 60px;max-width:1180px}
  .hint{background:#fff;border:1px dashed #cbd5e1;border-radius:var(--radius);padding:10px 14px;
        font-size:12.5px;color:var(--muted);margin-bottom:18px}
  .hint b{color:var(--ink)}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px 17px;transition:.15s}
  .card:hover{box-shadow:0 4px 16px rgba(15,23,42,.07);transform:translateY(-1px)}
  .card h3{margin:0 0 4px;font-size:14.5px;letter-spacing:-.1px}
  .card .meta{font-size:11.5px;color:var(--muted);margin-bottom:11px}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
      padding:3px 9px;border-radius:20px}
  .st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .st.ready{background:var(--med-bg);color:var(--med)}
  .st.done{background:var(--ok-bg);color:var(--ok)}
  .st.wip{background:var(--accent-soft);color:var(--accent)}
  .st.plan{background:#f1f5f9;color:#64748b}
  .bar{height:5px;border-radius:4px;background:#eef2f6;overflow:hidden;margin:12px 0 10px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
  .card .foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .stamps{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);
        margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
  .stamps div{display:flex;gap:6px;align-items:baseline}
  .stamps em{font-style:normal;color:#94a3b8;min-width:66px;display:inline-block}
  .stamps b{font-weight:600;color:#475569;font-variant-numeric:tabular-nums}
  .stamps .rel{color:#94a3b8}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:8px;
       font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .btn:hover{background:#f8fafc;border-color:#cbd5e1}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.pri:hover{background:#4338ca}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .row{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
       border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
  .row:hover{border-color:#c7d2fe;box-shadow:0 3px 12px rgba(79,70,229,.07)}
  .sev{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.03em;
       flex:0 0 auto;margin-top:2px}
  .sev.high{background:var(--high-bg);color:var(--high)}
  .sev.med{background:var(--med-bg);color:var(--med)}
  .sev.low{background:var(--low-bg);color:var(--low)}
  .row .body{flex:1;min-width:0}
  .row .id{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row .ttl{font-weight:600;margin:2px 0 3px;letter-spacing:-.1px}
  .row .sub{font-size:12px;color:var(--muted)}
  .ts{font-variant-numeric:tabular-nums}
  .row .tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .tag{font-size:11px;background:#f1f5f9;color:#475569;padding:2.5px 8px;border-radius:6px}
  .shots{margin-left:auto;display:flex;gap:5px;flex:0 0 auto}
  .shot{width:46px;height:34px;border-radius:5px;border:1px solid var(--line);overflow:hidden;
        background:linear-gradient(#eef2f7,#dde5ee);position:relative}
  .shot::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:3px;border-radius:2px;
        background:#b9c6d6;box-shadow:0 6px 0 #cbd5e1,0 12px 0 #dbe3ec}
  .empty{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:34px;
        text-align:center;color:var(--muted);font-size:13px}
  .back{margin-bottom:14px}
  .det{display:grid;grid-template-columns:1.35fr .95fr;gap:18px;align-items:start}
  @media (max-width:1000px){.det{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
       padding:17px 18px;margin-bottom:14px}
  .box h4{margin:0 0 3px;font-size:13.5px}
  .box .cap{font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .quote{background:#f8fafc;border-left:3px solid #cbd5e1;border-radius:0 8px 8px 0;
         padding:12px 14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
  .quote.tr{background:var(--accent-soft);border-left-color:var(--accent)}
  .kv{display:grid;grid-template-columns:104px 1fr;gap:8px 12px;font-size:12.5px}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .kv dd .ts{font-variant-numeric:tabular-nums}
  .kv dd .rel{color:#94a3b8;font-size:11.5px;margin-left:5px}

  /* timeline */
  .tl{position:relative;padding-left:22px}
  .tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .ev{position:relative;padding-bottom:16px}
  .ev:last-child{padding-bottom:0}
  .ev::before{content:"";position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;
        background:#fff;border:2.5px solid #cbd5e1;box-sizing:border-box}
  .ev.filed::before{border-color:var(--high)}
  .ev.translated::before{border-color:var(--accent)}
  .ev.status::before{border-color:var(--med)}
  .ev.comment::before{border-color:#94a3b8}
  .ev.done::before{border-color:var(--ok)}
  .ev .etxt{font-size:12.5px;line-height:1.5}
  .ev .etxt b{font-weight:600}
  .ev .etime{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
  .ev .etime .rel{color:#94a3b8;margin-left:5px}
  .ev .enote{font-size:11.5px;color:var(--muted);background:#f8fafc;border-radius:6px;
        padding:6px 9px;margin-top:6px;font-style:italic}

  .shots-lg{display:flex;gap:10px;flex-wrap:wrap}
  .shot-lg{width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;
        background:#fff}
  .sbar{background:#f1f5f9;border-bottom:1px solid var(--line);padding:6px 9px;font-size:10.5px;
        color:var(--muted);display:flex;gap:5px;align-items:center}
  .sdot{width:7px;height:7px;border-radius:50%;background:#e2e8f0}
  .sbody{padding:16px 14px;background:repeating-linear-gradient(180deg,#fff,#fff 13px,#f7f9fc 13px,#f7f9fc 14px)}
  .fake{height:9px;border-radius:3px;background:#e8eef5;margin-bottom:9px}
  .fake.w40{width:40%} .fake.w70{width:70%} .fake.w55{width:55%}
  .fake.hl{background:#fde68a}
  .statusbar{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
        cursor:pointer;background:#fff;color:#475569;font-family:inherit}
  .chip:hover{background:#f8fafc}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .copybox{background:linear-gradient(135deg,#1e293b,#0f172a);color:#e2e8f0;border-radius:var(--radius);
        padding:15px 17px}
  .copybox h4{color:#fff;margin:0 0 3px;font-size:13.5px}
  .copybox p{margin:0 0 11px;font-size:11.5px;color:#94a3b8}
  .copybox textarea{width:100%;height:150px;background:#0b1220;color:#cbd5e1;border:1px solid #334155;
        border-radius:8px;padding:10px;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
        resize:vertical}
  .copyrow{display:flex;gap:8px;margin-top:10px;align-items:center}

  /* ── download surfaces (§10) ───────────────────────────────── */
  .dlrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  .dlhint{font-size:11px;color:var(--muted);line-height:1.45}
  .dl{font-size:10.5px;color:var(--muted);cursor:pointer;border:1px solid var(--line);
      background:#fff;border-radius:5px;padding:1px 7px;margin-left:auto;font-family:inherit;
      flex:0 0 auto}
  .dl:hover{background:#eef2ff;color:var(--accent);border-color:#c7d2fe}
  .clibox{background:#0f172a;border-radius:var(--radius);padding:15px 17px;margin-top:14px;color:#e2e8f0}
  .clibox h4{color:#fff;margin:0 0 3px;font-size:13.5px}
  .clibox p{margin:0 0 11px;font-size:11.5px;color:#94a3b8;line-height:1.5}
  .cmdrow{display:flex;align-items:center;gap:9px;background:#0b1220;border:1px solid #334155;
      border-radius:8px;padding:8px 11px}
  .cmdrow code{color:#a5f3fc;flex:1;overflow-x:auto;white-space:nowrap;
      font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  .cmdrow .btn{background:#1e293b;border-color:#334155;color:#e2e8f0;flex:0 0 auto}
  .cmdrow .btn:hover{background:#334155;border-color:#475569}
  .cliout{margin-top:10px;font:11px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;color:#94a3b8}
  .cliout b{color:#34d399;font-weight:600}
  .cliout .arrow{color:#c7d2fe}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
        background:#0f172a;color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;
        opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .lb{position:fixed;inset:0;background:rgba(15,23,42,.82);display:none;place-items:center;z-index:100;padding:40px}
  .lb.on{display:grid}
  .lb .inner{background:#fff;border-radius:12px;max-width:760px;width:100%;overflow:hidden}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">RGM</div>
      <div><b>Project Manager</b><span>Dev ↔ Tester</span></div>
    </div>
    <div class="roles">
      <div class="role on" data-role="tester"><span>🧪</span><span id="r-tester">Tester</span><span class="dot"></span></div>
      <div class="role" data-role="dev"><span>💻</span><span id="r-dev">Developer</span><span class="dot"></span></div>
    </div>
    <div>
      <h4 id="h-proj">Projects</h4>
      <div class="plist" id="plist"></div>
    </div>
    <div>
      <h4 id="h-nav">Navigation</h4>
      <nav id="nav">
        <div class="nav on" data-view="milestones"><span>🎯</span><span id="n-ms">Milestones</span></div>
        <div class="nav" data-view="bugs"><span>🐞</span><span id="n-bugs">Bugs</span>
          <span class="badge" id="bg-count">0</span></div>
      </nav>
    </div>
    <div class="spacer"></div>
    <div class="langbox" id="langbox">
      <h4 id="h-lang">Language</h4>
      <div class="langrow">
        <div class="lang on" data-lang="vi">Tiếng Việt</div>
        <div class="lang" data-lang="zh">中文</div>
        <div class="lang" data-lang="en">EN</div>
      </div>
      <div class="synced" id="synced"></div>
    </div>
  </aside>

  <main>
    <div class="top">
      <div>
        <div class="project" id="t-proj"></div>
        <h2 id="t-title"></h2>
      </div>
      <div class="right">
        <span class="pill" id="t-role"></span>
        <span class="pill gray" id="t-env">Staging</span>
        <div class="who"><div class="av" id="t-av">NH</div><span id="t-who"></span></div>
      </div>
    </div>
    <div class="wrap">
      <div class="hint" id="hint"></div>
      <div id="view"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="lb" id="lb"><div class="inner" id="lb-inner"></div></div>

/* ═══════════════════════  TIME HELPERS  ═══════════════════════ */
const asDate = ts => new Date(String(ts).replace(" ", "T") + TZ_OFFSET);
const TZ = "Asia/Ho_Chi_Minh";
const TZ_OFFSET = "+07:00";
const fmtLocal = d => new Intl.DateTimeFormat("sv-SE", {
  timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hour12: false
}).format(d);
function rel(ts){
  const mins = Math.round((NOW - asDate(ts)) / 60000);
  if(mins < 1)    return t("justNow");
  if(mins < 60)   return mins + t("mAgo");
  if(mins < 1440) return Math.round(mins/60) + t("hAgo");
  return Math.round(mins/1440) + t("dAgo");
}
const stamp = ts => `<span class="ts">${ts}</span><span class="rel">${rel(ts)}</span>`;

/* ═══════════════════════  STATE  ═══════════════════════ */
let LANG = "vi", ROLE = "tester", PROJ = PROJECTS[0].id, VIEW = "milestones", OPEN = null;
const t = k => T[LANG][k];

// Deep links: ?role=dev&lang=zh&project=leave&view=bugs&bug=BUG-118
(function(){
  const q = new URLSearchParams(location.search);
  const qRole = q.get("role"), qLang = q.get("lang"),
        qProj = q.get("project"), qView = q.get("view"), qBug = q.get("bug");
  if(["tester","dev"].includes(qRole)) ROLE = qRole;
  if(["vi","zh","en"].includes(qLang)) LANG = qLang;
  else if(qRole === "dev") LANG = "zh";
  if(PROJECTS.some(p => p.id === qProj)) PROJ = qProj;
  if(["milestones","bugs"].includes(qView)) VIEW = qView;
  if(qBug) OPEN = qBug;
})();

const proj     = () => PROJECTS.find(p => p.id === PROJ);
const openBugs = p => (p.bugs || []).filter(b => b.status !== "closed").length;
const findBug  = (p, id) => (p.bugs || []).find(b => b.id === id);
const lastActivity = p => {
  const hits = [...p.milestones.map(m=>m.updated), ...(p.bugs||[]).map(b=>b.updated)];
  return hits.sort().pop();
};

function bugTitle(b){ return LANG==="vi" ? b.viT : LANG==="zh" ? b.zhT : b.enT; }
function msTitle(m){ return LANG==="vi" ? m.vi : LANG==="zh" ? m.zh : m.en; }
function pName(p){ return LANG==="vi" ? p.vi : LANG==="zh" ? p.zh : p.en; }
function bugTr(b){ return LANG==="zh" ? b.zhDesc : b.enDesc; }
function stClass(s){ return s==="ready"?"ready":s==="done"?"done":s==="wip"?"wip":"plan"; }
function statusLabel(s){
  return s==="new"?t("stNew") : s==="fixing"?t("stFixing")
       : s==="retest"?t("stRetest") : t("stClosed");
}

    const n = openBugs(p);
    return `<div class="proj ${p.id===PROJ?"on":""}" data-project="${p.id}" title="${pName(p)}">
      <span class="sq" style="background:${p.color}"></span>
      <span class="nm">${pName(p)}</span>
      <span class="cnt ${n?"":"zero"}">${n||""}</span>
    </div>`;
  }).join("");

  document.getElementById("bg-count").textContent = openBugs(P);
  document.querySelectorAll(".role").forEach(e=>e.classList.toggle("on", e.dataset.role===ROLE));
  document.querySelectorAll(".nav").forEach(e=>e.classList.toggle("on", e.dataset.view===VIEW && !OPEN));
  document.querySelectorAll(".lang").forEach(e=>e.classList.toggle("on", e.dataset.lang===LANG));

  const lb = document.getElementById("langbox");
  lb.style.opacity = ROLE==="tester" ? .45 : 1;
  lb.style.pointerEvents = ROLE==="tester" ? "none" : "auto";

  document.getElementById("t-proj").textContent =
    `${pName(P)} · ${t("client")}: ${P.client}`;
  const bugOpen = OPEN ? findBug(P, OPEN) : null;
  document.getElementById("t-title").textContent =
    bugOpen ? t("titleDetail") : VIEW==="milestones" ? t("ms") : t("bugs");
  document.getElementById("t-role").textContent = t("roleT");
  const act = lastActivity(P);          // single source of truth for project activity
  document.getElementById("t-env").innerHTML =
    `${P.env}${act ? ` · <span class="ts">${act}</span><span class="rel">${rel(act)}</span>` : ""}`;
  document.getElementById("t-who").textContent  = t("who");
  document.getElementById("t-av").textContent   = ROLE==="tester" ? "NH" : (LANG==="zh" ? "陳" : "AC");

  document.getElementById("hint").innerHTML = `<b>${t("hintT")}</b><br>${t("hintB")}`;

  const v = document.getElementById("view");
  if(bugOpen) v.innerHTML = detailHTML(P, bugOpen);
  else if(VIEW==="milestones") v.innerHTML = milestonesHTML(P);
  else v.innerHTML = bugsHTML(P);

  bind();
}

function eventText(e){
  if(e.what === "filed")       return `<b>${e.actor}</b> ${t("filed")}`;
  if(e.what === "translated")  return `${t("translatedEv")}`;
  if(e.what === "statusNew")   return `<b>${e.actor}</b> ${t("statusNew")} → ${statusLabel(e.to)}`;
  if(e.what === "statusTo")    return `<b>${e.actor}</b> ${t("statusTo")} ${statusLabel(e.to)}`;
  if(e.what === "comment")     return `<b>${e.actor}</b> ${t("comment")}`;
  if(e.what === "retestPass")  return `<b>${e.actor}</b> ${t("statusTo")} ${statusLabel("closed")}`;
  return "";
}

function timelineHTML(b){
  return `<div class="tl">` + (b.events||[]).map(e=>`
    <div class="ev ${e.kind}">

      <div class="etime">${stamp(e.at)}</div>

}

function aiPrompt(P, b){
  const m = P.milestones.find(x => x.code === b.ms);
  const tl = (b.events||[]).map(e=>{
    const label = e.what==="filed" ? "filed the bug"
                : e.what==="translated" ? "auto-translated"
                : e.what==="statusNew" ? "changed status to " + e.to
                : e.what==="statusTo" ? "moved to " + e.to
                : e.what==="comment" ? "commented"
                : e.what==="retestPass" ? "passed retest, closed the bug"
                : e.what==="retestFail" ? "failed retest, returned to fixing"
                : "event: " + e.what;          // never render a bare kind again
    return `  [${e.at}] ${e.actor} — ${label}${e.note ? " :: " + e.note : ""}`;
  }).join("\n");
  return `Bug ${b.id} — ${b.enT}
Project: ${P.en} (client: ${P.client})
Milestone: ${b.ms}${m ? " — " + m.en : ""}
Severity: ${SEV[b.sev].en}  |  Status: ${b.status}
Tester: ${b.tester}
Reported: ${b.when}
Last updated: ${b.updated}
Environment: ${P.env}

--- Original report (Vietnamese) ---
${b.viDesc}

--- English translation ---
${b.enDesc}

--- Activity timeline ---
${tl}

--- Attachments ---
${Array.from({length:b.shots}).map((_,i)=>`screenshot_0${i+1}.png`).join(", ")}
`;
}

/* ═══════════════════════  BIND (delegated)  ═══════════════════════ */
let BOUND = false;
function bind(){
  if(BOUND) return; BOUND = true;
  document.getElementById("lb").onclick = e => { if(e.target.id==="lb") e.currentTarget.classList.remove("on"); };

  document.addEventListener("click", e => {
    const hit = sel => e.target.closest(sel);
    let el;

    if((el = hit("[data-role]"))){
      ROLE = el.dataset.role;
      LANG = ROLE==="tester" ? "vi" : (LANG==="vi" ? "zh" : LANG);
      OPEN = null; render(); return;
    }
    if((el = hit("[data-project]"))){
      PROJ = el.dataset.project; OPEN = null;
      toast(pName(proj()));
      render(); return;
    }
    if((el = hit("[data-view]"))){
      VIEW = el.dataset.view; OPEN = null; render(); return;
    }
    if((el = hit("[data-lang]"))){
      if(ROLE === "tester") return;          // testers only ever see Vietnamese
      LANG = el.dataset.lang; render(); return;
    }
    if((el = hit("[data-bug]"))){
      OPEN = el.dataset.bug; render(); return;
    }
    if((el = hit("[data-back]"))){
      OPEN = null; render(); return;
    }
    if((el = hit("[data-open]"))){
      VIEW = "bugs"; OPEN = null; render(); return;
    }
    if((el = hit("[data-report]"))){
      VIEW = "bugs"; OPEN = null;
      toast(LANG==="vi" ? "Mở biểu mẫu báo lỗi cho " + el.dataset.report
          : LANG==="zh" ? "開啟 " + el.dataset.report + " 的 bug 回報表單"
          : "Opening bug form for " + el.dataset.report);
      render(); return;
    }
    if((el = hit("[data-copy]"))){
      const ta = document.getElementById("aiprompt");
      if(!ta) return;
      ta.focus(); ta.select();                 // keep the text selected either way
      const FAIL = {
        vi: "Không sao chép được — nội dung đã được chọn, hãy nhấn ⌘C",
        zh: "複製失敗 — 內容已選取,請按 ⌘C 手動複製",
        en: "Copy failed — text is selected, press ⌘C to copy manually"
      };
      const ok = () => {
        el.textContent = "✓ " + t("copyBtn").replace("📋 ","");
        toast(t("copied"));
        setTimeout(()=>{ el.textContent = t("copyBtn"); }, 2000);
      };
      const fail = () => toast(FAIL[LANG]);    // never claim a copy we did not get
      let legacy = false;
      try { legacy = document.execCommand("copy"); } catch(err){ legacy = false; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(ok).catch(() => legacy ? ok() : fail());
      } else if(legacy){ ok(); } else { fail(); }
      return;
    }
    if((el = hit("[data-dl]"))){                 // one screenshot → real PNG bytes
      const name = el.dataset.dl;
      placeholderPngBytes(name).then(bytes => {
        saveBlob(new Blob([bytes], { type: "image/png" }), name);
        toast("⬇ " + name);
      });
      return;
    }
    if((el = hit("[data-zip]"))){                // "Download all" → the real packet
      const P = proj(), b = findBug(P, OPEN);
      if(!b) return;
      packetZip(P, b).then(({ blob, name }) => {
        saveBlob(blob, name);
        toast(t("dlZip"));
      });
      return;
    }
    if((el = hit("[data-cmd]"))){                // copy the CLI handoff command
      const cmd = el.dataset.cmd;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(cmd)
          .then(() => toast(t("cliDone") + " — $ " + cmd))
          .catch(() => toast("$ " + cmd));       // still show it if the write failed
      } else { toast("$ " + cmd); }
      return;
    }
    if((el = hit(".shot-lg"))){
      document.getElementById("lb-inner").innerHTML = el.outerHTML;
      document.getElementById("lb").classList.add("on");
      return;
    }
  });
}

/* ═══════════════  PACKET / DOWNLOAD HELPERS (PLAN §10)  ═══════════════ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const u8cat = parts => {
  const n = parts.reduce((s, p) => s + p.length, 0);
  const out = new Uint8Array(n);
  let o = 0;
  for (const p of parts){ out.set(p, o); o += p.length; }
  return out;
};
/* Real PNG bytes, drawn in-browser — so the downloaded file is an actual image
   rather than a renamed text file. */
async function placeholderPngBytes(name){
  const c = document.createElement("canvas");
  c.width = 720; c.height = 440;
  const g = c.getContext("2d");
  g.fillStyle = "#eef2f7"; g.fillRect(0, 0, 720, 440);
  g.strokeStyle = "#b9c6d6"; g.lineWidth = 2; g.strokeRect(24, 24, 672, 392);
  g.fillStyle = "#64748b";
  g.font = "18px -apple-system, BlinkMacSystemFont, sans-serif";
  g.fillText("screenshot placeholder", 48, 78);
  g.font = "14px ui-monospace, SFMono-Regular, Menlo, monospace";
  g.fillText(name, 48, 112);
  g.fillText("In the real build this is the tester's uploaded image,", 48, 152);
  g.fillText("re-encoded server-side with EXIF stripped (PLAN.md §8, §13).", 48, 174);
  g.fillStyle = "#94a3b8";
  g.fillText("mock UI — not a real screenshot", 48, 388);
  const blob = await new Promise(res => c.toBlob(res, "image/png"));
  return new Uint8Array(await blob.arrayBuffer());
}

/* Minimal STORE-method ZIP, so the mock emits a genuinely openable archive. */
function makeZip(files){
  const enc = new TextEncoder();
  const u16 = n => new Uint8Array([n & 255, (n >> 8) & 255]);
  const u32 = n => new Uint8Array([n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >> 24) & 255]);
  const d = new Date();
  const tm = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  const local = [], central = [];
  let offset = 0;
  for (const f of files){
    const nb = enc.encode(f.name), db = (f.data || enc.encode(f.text)), crc = crc32(db);
    const lh = u8cat([u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(tm), u16(dt),
                      u32(crc), u32(db.length), u32(db.length), u16(nb.length), u16(0)]);
    local.push(lh, nb, db);
    central.push(u8cat([u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(tm), u16(dt),
                        u32(crc), u32(db.length), u32(db.length), u16(nb.length),
                        u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)]), nb);
    offset += lh.length + nb.length + db.length;
  }
  const cd = u8cat(central);
  const eocd = u8cat([u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
                      u32(cd.length), u32(offset), u16(0)]);
  return new Blob([...local, cd, eocd], { type: "application/zip" });
}
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
/* Packet entry names are SERVER-assigned. A tester-controlled filename is kept
   only as data inside meta.json — it must never become a path on disk (zip-slip). */
async function packetFiles(P, b){
  const slug = b.enT.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
  const meta = {
    id: b.id,
    project: { id: P.id, name: P.en, client: P.client, env: P.env },
    milestone: b.ms, severity: SEV[b.sev].en, status: b.status,
    tester: b.tester, reported_at: b.when, updated_at: b.updated,
    attachments: Array.from({ length: b.shots }, (_, i) => ({
      name: `screenshot_0${i + 1}.png`,
      original_filename: `screenshot_0${i + 1}.png`,
      content_type: "image/png"
    }))
  };
  const files = [
    { name: "bug.md",    text: aiPrompt(P, b) },   // byte-identical to the clipboard payload
    { name: "meta.json", text: JSON.stringify(meta, null, 2) }
  ];
  for (let i = 0; i < b.shots; i++){
    files.push({
      name: `screenshot_0${i + 1}.png`,
      data: await placeholderPngBytes(`screenshot_0${i + 1}.png`)
    });
  }
  return { files, slug };
}
async function packetZip(P, b){
  const { files, slug } = await packetFiles(P, b);
  return { blob: makeZip(files), name: `${b.id}-${slug}.zip` };
}

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("on"), 2400);
}
render();
